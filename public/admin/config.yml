# Replace this value after creating the site in Decap Turbo. See docs/deployment/decap-cms.md.
site_url: https://samngoclinh.pages.dev

backend:
  name: turbo-github
  turbo_site_id: ae1498f9-0a04-4336-a5bd-072e4e99cff8
  branch: codex/implement-13

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: categories
    label: Product categories
    label_singular: Product category
    folder: src/data/categories
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    sortable_fields:
      - field: order
        label: Display order
        default_sort: asc
      - title
    view_filters:
      - label: Archived
        field: archived
        pattern: true
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Category image, name: image, widget: image }
      - { label: Image description, name: alt, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Archived, name: archived, widget: boolean, default: false, required: false }

  - name: products
    label: Products
    label_singular: Product
    folder: src/data/products
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    sortable_fields:
      - field: order
        label: Display order
        default_sort: asc
      - title
    view_filters:
      - label: Archived
        field: archived
        pattern: true
    fields:
      - { label: Name, name: title, widget: string }
      - label: Primary category
        name: category
        widget: relation
        collection: categories
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
      - { label: Product image, name: image, widget: image }
      - { label: Image description, name: alt, widget: string }
      - { label: Package size or card summary, name: summary, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Product information, name: product_info, widget: markdown, required: false }
      - { label: Benefits, name: benefits, widget: list, required: false }
      - { label: Recommended users, name: recommended_users, widget: markdown, required: false }
      - { label: Directions, name: directions, widget: markdown, required: false }
      - { label: Usage notes, name: usage_notes, widget: markdown, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Archived, name: archived, widget: boolean, default: false, required: false }

  - name: news
    label: Nhật ký Ngọc Linh
    label_singular: Bài viết
    folder: src/data/news
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    sortable_fields:
      - order
      - date
      - title
    view_filters:
      - label: Archived
        field: archived
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Use a unique URL-friendly value, for example hanh-trinh-ngoc-linh." }
      - { label: Publication date, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY" }
      - { label: Summary, name: summary, widget: text }
      - { label: Article body, name: body, widget: text }
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Archived, name: archived, widget: boolean, default: false, required: false }
  - name: listing-page
    label: Product listing page
    files:
      - name: products-page
        label: Product listing sections
        file: src/data/pages/products.json
        preview_path: /
        fields:
          - label: Page sections
            name: sections
            widget: list
            label_singular: section
            summary: '{{fields.title}} · {{type}}'
            types:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - { label: Section title, name: title, widget: string }
                  - { label: Supporting text, name: body, widget: text }
              - label: Category cards
                name: categories
                widget: object
                fields:
                  - { label: Section title, name: title, widget: string }
                  - { label: Supporting text, name: body, widget: text, required: false }
              - label: All products
                name: products
                widget: object
                fields:
                  - { label: Section title, name: title, widget: string }
                  - { label: Supporting text, name: body, widget: text, required: false }
              - label: Certificates
                name: certificates
                widget: object
                fields:
                  - { label: Section title, name: title, widget: string }
                  - { label: Supporting text, name: body, widget: text, required: false }
              - label: Store & contact
                name: contact
                widget: object
                fields:
                  - { label: Section title, name: title, widget: string }
                  - { label: Store and contact details, name: body, widget: text }

