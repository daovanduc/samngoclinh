name: Site checks

on:
  pull_request:
  push:
    # The default branch is also the Cloudflare Pages production branch and
    # receives Decap CMS commits directly.
    branches: [prototype/designed-section-editor]

permissions:
  contents: read

jobs:
  build:
    name: Content validation and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    name: Generated-site browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
